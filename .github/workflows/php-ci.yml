name: PHP CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: 语法检查 (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: php -l 全量语法检查
        run: |
          ERR=0
          while IFS= read -r -d '' f; do
            php -l "$f" || ERR=1
          done < <(find app public scripts -name '*.php' -print0)
          exit $ERR
